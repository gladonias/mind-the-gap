[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mind-the-gap"
version = "0.4.0"
description = "A spaced repetition study planner — not flashcards, but a scheduler for your learning."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Mind the Gap Contributors"},
]
keywords = ["spaced-repetition", "study", "learning", "cli", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "click>=8.1",
    "toml>=0.10",
    "rich>=13.0",
]

[project.scripts]
mtg = "mtg.cli:main"

[project.urls]
Homepage = "https://github.com/mind-the-gap-study/mind-the-gap"
Repository = "https://github.com/mind-the-gap-study/mind-the-gap"
Issues = "https://github.com/mind-the-gap-study/mind-the-gap/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
